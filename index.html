<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      El logo es lo primero que se ve (splash + mesa por QR). Sin este
      preload, el browser recien lo descubre cuando React ya renderizo el
      <img> — despues de bajar y ejecutar todo el JS. Con esto arranca la
      descarga en paralelo, apenas se parsea el HTML.
    -->
    <link rel="preload" as="image" href="/img/loader-logo-v2.webp" fetchpriority="high">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Topasc</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
